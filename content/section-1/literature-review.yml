# section-1/literature-review.html — Stage 1.
# The filename stays `literature-review` even though the page is now titled
# "Background Research & Evidence Synthesis": page IDs are derived from
# filenames, so renaming would break every cross-page `ref:` and change the
# published URL.

title: "Background Research &amp; Evidence Synthesis | BR-UK AI"
description: "AI tools for background research and evidence synthesis — Elicit, Undermind, Perplexity, Manus, NotebookLM, Scite, Consensus — plus responsible-use guidance from Cochrane and RAISE."

breadcrumb:
  - { ref: "home",      label: "Home" }
  - { ref: "section-1", label: "Section 1: Living Guide" }
  - { label: "Background Research &amp; Evidence Synthesis" }

badge: "Section 1 · Stage 1"
heading: "Background Research &amp; Evidence Synthesis"

body:
  - prose:
      - lede: |
          AI tools can help streamline the early stages of research by finding relevant
          papers, summarising academic content, and even pointing to gaps in the existing
          literature. They're particularly useful when you're getting familiar with a new
          topic, developing your research question, or exploring unfamiliar areas. While
          these tools don't replace a rigorous, systematic literature review, they can save
          time and support your background research.
      # Only the page's two major sections — the sub-headings made this a flat,
      # undifferentiated wall of links.
      - quicknav:
          items:
            - { href: "#background-research", label: "Background Research" }
            - { href: "#evidence-synthesis",  label: "Evidence Synthesis" }

      # ---- Major section 1 of 2 ------------------------------------------
      - h2: { id: "background-research", text: "Background Research" }
      - h3: { id: "what-ai-helps-with", text: "What AI can help with" }
      - markdown: |
          AI can help you:

          - Find relevant papers faster by looking at meaning, not just keywords.
          - Summarise studies and highlight key findings, limitations, and methods.
          - Identify gaps in the literature by comparing many papers at once.
          - Discover related work and visualise how studies are connected.
          - Organise your reading with tools that can "remember" and search through the documents you've saved.

          Different tools have different strengths, so it's worth trying a few. Always
          double-check any AI-generated summaries by reviewing the original papers directly.
      - h3: { id: "tools", text: "Tools" }
      # One card per tool, ordered so tools doing a similar job sit next to each
      # other on the grid — the grid is two columns at this page's width.
      # heading_level: h4 because this grid sits under an h3, not an h2 — without
      # it the card names would be siblings of the "Tools" heading above them.
      - tool_grid:
          heading_level: "h4"
          items:
          - { url: "https://elicit.com/",                     name: "Elicit",                    desc: "Pulls research questions, findings and limitations out of papers into a table. Built for fast exploratory reviews." }
          - { url: "https://www.undermind.ai/",               name: "Undermind",                 desc: "Ranks papers by relevance and keeps summaries deliberately short, so you go back to the original." }
          - { url: "https://www.perplexity.ai/",              name: "Perplexity",                desc: "Answers questions with direct links to its sources. Switch search to \"Academic\" for peer-reviewed work." }
          - { url: "https://manus.im/",                       name: "Manus",                     desc: "Runs multi-step search and browsing tasks unattended and returns a written result." }
          - { url: "https://notebooklm.google/",              name: "NotebookLM",                desc: "Restricts its answers to the papers and notes you upload, with citations back to them." }
          - { url: "https://natureresearchassistant.com/",    name: "Nature Research Assistant",  desc: "Comments on a draft manuscript's structure and substance, and flags where references may be missing." }
          - { url: "https://scite.ai/home",                   name: "Scite",                     desc: "Labels citations as supporting, contrasting or merely mentioning, with quotes from the citing papers." }
          - { url: "https://consensus.app/",                  name: "Consensus",                 desc: "Searches papers to show where the evidence agrees and disagrees on a question." }
          - { url: "https://researchrabbitapp.com/",          name: "ResearchRabbit",            desc: "Follows citation trails from papers you already have. Works well with Zotero." }
          - { url: "https://www.connectedpapers.com/",        name: "Connected Papers",          desc: "Builds a visual map around a starting paper, grouping work by shared references and citations." }
      - h3: { id: "learn-more", text: "Hear from researchers using them" }
      - markdown: |
          Walkthroughs and write-ups from people using these tools in practice:

          - [This AI Synthesizes 500 Papers So You Don't Have To](https://www.youtube.com/watch?v=bXN9B8_Pfl8) — a video walkthrough of Elicit.
          - [Scite AI Just Changed How I Trust Research](https://www.youtube.com/watch?v=BZokMJVLAsw) — a video tutorial on Scite.
          - [Best AI Tools for Literature Review](https://www.researchrabbit.ai/articles/best-ai-tools-for-literature-review) — ResearchRabbit's own round-up.

      # ---- Major section 2 of 2 ------------------------------------------
      # The rule reinforces the split between the two halves of the page.
      - raw: |
          <hr style="margin: 2.4em 0 0">
      - h2: { id: "evidence-synthesis", text: "Evidence Synthesis" }
      - markdown: |
          AI is now used at several points in the review workflow, but we do **not**
          recommend running a review end to end on tools like Undermind or Elicit. Where
          the work has to be rigorous, comprehensive and repeatable, established methods
          still set the standard — use AI to support manual methods and expert judgement,
          not to replace them.

          Three resources are worth knowing before you start.
      - h3: { id: "position-statement", text: "1. Joint position statement on AI in evidence synthesis (2025)" }
      - markdown: |
          Four shared expectations from Cochrane, the Campbell Collaboration, JBI and the
          Collaboration for Environmental Evidence — see the
          [full statement](https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.ED000178/full):

          - **Stay accountable.** You remain responsible for the review, whatever tools you used — for choosing them, for how you applied them, and for their effect on your methods and conclusions.
          - **Justify the choice.** Show the tool suits your specific review and does not weaken its reliability.
          - **Declare it.** Wherever AI makes or suggests a judgement, report the tool, version, dates, prompts and validation steps under PRISMA/ROSES.
          - **Follow the usual rules.** Copyright, licensing, confidentiality, privacy and data-protection duties are unchanged by using AI.
      - h3: { id: "raise", text: "2. RAISE — responsible use of AI in evidence synthesis" }
      - markdown: |
          [RAISE](https://osf.io/fwaud/overview) turns those expectations into a working
          method: how to pick a tool for each task, pilot it on your own material before
          trusting it, record what you did in your protocol and methods, and handle the legal
          and ethical risk. It is designed to sit alongside existing guidance — the Cochrane
          Handbook, Campbell and JBI methods, PRISMA and ROSES — rather than replace it.

          *Systematic Reviews* has a short recorded introduction covering both the position
          statement and RAISE.
      - h3: { id: "repositories", text: "3. Repositories of AI tools for evidence review and synthesis" }
      - markdown: |
          Two places to check before committing to a tool:

          - [MetaEvidenceAI](https://metaevidenceai.com/) — a living registry of published evaluations of AI tools for evidence synthesis, led by Dr Ciara Keenan. An existing evaluation is the fastest support for your justification, and you can add your own.
          - [King's College London — AI Tools in Evidence Synthesis](https://libguides.kcl.ac.uk/systematicreview/ai) — an overview of tools for building search strategies, finding relevant articles, and screening, extracting and synthesising data.
      # Its own heading, because this closing advice applies to all three
      # resources above — under a single resource's h3 it read as specific to that one.
      - h3: { id: "in-practice", text: "Putting this into practice" }
      - markdown: |
          Use all three to shape your own policy, training and day-to-day practice, so that a
          reader of your review can see what AI did and why that was a defensible choice.


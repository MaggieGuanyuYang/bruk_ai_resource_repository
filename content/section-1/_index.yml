# section-1/index.html — Section 1 overview ("Living Guide").

title: "Section 1: Living Guide of AI in Behavioural Research | BR-UK"
description: "Resources on how to use AI in literature review, hypothesis generation, data collection, analysis, and writing & reporting."

breadcrumb:
  - { ref: "home", label: "Home" }
  - { label: "Section 1: Living Guide" }

badge: "Section 1"
heading: "Living Guide of AI in the Behavioural Research Process"

body:
  - prose:
      - lede:
          font_size: "1.12rem"
          text: |
            AI can assist in multiple stages of the research process, from literature reviews
            to data analysis and report writing. It has the ability to enhance the work we are
            doing, making daily tasks simpler and less onerous, but there are some things to
            consider before starting a project.
      # Bounded by rules top and bottom so this detour reads as distinct from the
      # lede above and the stage list below. Deliberately kept off the heading
      # hierarchy — "Jump to a stage of your research" is the page's only h2.
      - raw: |
          <hr style="margin: 1.5em 0 1.1em">
      - markdown: |
          **Not sure where to start?** If you do not have a specific research task or AI tool in mind, check out these resources:

          - [Caltech Science Exchange](https://scienceexchange.caltech.edu/topics/artificial-intelligence-research) — what AI is and what it can do.
          - [AI and the future of behavioural science](https://www.youtube.com/watch?v=x1hojUoNbFM&amp;t=35s) — LSE public event on how AI is already changing the field.
          - [Can Generative AI improve social science?](https://doi.org/10.1073/pnas.2314021121) — Bail (2024), *PNAS*.
      - raw: |
          <hr style="margin: 1.1em 0 0">
      - h2: { id: "research-stages", text: "Jump to a stage of your research" }
      - markdown: |
          Each sub-page covers a specific stage of the research lifecycle, with tools, real
          examples, and key references.
  - subpage_list:
      variant: "stages"
      labelledby: "research-stages"
      items:
        - ref: "section-1.literature-review"
          title: "Background Research &amp; Evidence Synthesis"
          blurb: "Find and map relevant papers, then use AI responsibly in systematic reviews."
        - ref: "section-1.hypothesis-generation"
          title: "Hypothesis Generation &amp; Study Design"
          blurb: "Refine research questions, generate hypotheses, and design surveys or interventions."
        - ref: "section-1.data-collection"
          title: "Data Collection &amp; Processing"
          blurb: "Use chatbots, transcription tools, and synthetic data to collect and clean data."
        - ref: "section-1.data-analysis"
          title: "Data Analysis &amp; Interpretation"
          blurb: "Analyse qualitative and quantitative data with AI-powered tools and LLMs."
        - ref: "section-1.writing-reporting"
          title: "Writing &amp; Reporting"
          blurb: "Draft, edit, cite, and disseminate research with AI support — responsibly."
  - callout:
      heading: "A Note on Responsible Use"
      body: |
        We advocate for a human-in-the-loop approach with thorough testing and careful
        evaluation of AI methods. Researchers should explore AI's capabilities
        responsibly, aware of benefits and inherent challenges — see
        [Section 2](../section-2/index.html) and the
        [Section 5 BR-UK AI Statement](../statement.html) for responsible use of AI.

pager:
  prev: { ref: "home",                          label: "Back to",     title: "Home" }
  next: { ref: "section-1.literature-review",   label: "Start with",  title: "Background Research &amp; Evidence Synthesis" }

# section-1/hypothesis-generation.html — Stage 2.
# Citations are in-text and hyperlinked (e.g. "(Tong et al., 2024)") rather than
# full reference strings in blockquotes: a standout quote made a bare reference
# look like important content when it is only a pointer.

title: "Hypothesis Generation &amp; Study Design | BR-UK AI"
description: "AI for hypothesis generation and study design — refining research questions, designing surveys and interview guides, suggesting methods, and generating intervention content."

breadcrumb:
  - { ref: "home",      label: "Home" }
  - { ref: "section-1", label: "Section 1: Living Guide" }
  - { label: "Hypothesis Generation &amp; Study Design" }

badge: "Section 1 · Stage 2"
heading: "Hypothesis Generation &amp; Study Design"

body:
  - prose:
      - lede: |
          Generating research questions is a core part of behavioural science, but it's
          not easy. Researchers often spend months narrowing down a testable idea, as this
          process relies on reading and assessing large volumes of prior work. With
          thousands of new studies published each year, it's becoming harder to keep up —
          and easier to miss important gaps in the literature.
      - markdown: |
          AI tools can help by scanning and synthesising large bodies of research to
          suggest new hypotheses, highlight underexplored areas, and turn vague ideas into
          testable questions. Some tools can also recommend appropriate methods or
          generate draft materials such as surveys, interview guides, and behavioural
          interventions.
      # Boxed so the summary of capabilities reads as a single unit rather than a
      # loose bullet list competing with the sections below.
      - callout:
          heading: "What AI can help with"
          body: |
            - Analysing existing literature or large datasets and suggesting hypotheses.
            - Designing research materials, such as surveys, stimuli, and interview guides.
            - Refining vague or complex research questions into clear, precise and testable formats.
            - Suggesting methods it would expect you to be using, based on your research question.
            - Generating tailored intervention content — personalised health messages, therapy scripts, learning modules.
            - Analysing past intervention data to refine strategies.
      - quicknav:
          items:
            - { href: "#tools",    label: "Choosing a tool" }
            - { href: "#examples", label: "Examples" }
      # Not "Tools": the standalone tool grid was removed at the editor's request,
      # so this section is now about which tools to reach for and how far to trust
      # them, not a list of them.
      - h2: { id: "tools", text: "Choosing a tool" }
      - markdown: |
          Most of the examples below use general-purpose large language models — ChatGPT,
          Claude, Copilot — adapted by researchers for a specific study task. Treat what
          they return as a draft: an evaluation of six AI tools for finding research gaps
          ([Soriano et al., 2024](https://bpasjournals.com/library-science/index.php/journal/article/view/632))
          found that some returned accurate, useful references while others fabricated
          sources outright.
      # Each example is one h3 and one paragraph, so the set reads as a parallel
      # group rather than a long scroll of uneven blocks.
      - h2: { id: "examples", text: "Examples" }
      - h3: "Refining research questions and suggesting hypotheses"
      - markdown: |
          A recent study ([Tong et al., 2024](https://doi.org/10.1057/s41599-024-03407-5))
          combined GPT-4 with causal graphs — maps of cause-and-effect relationships in
          research — and analysed over 43,000 psychology papers to generate 130 new
          hypotheses about well-being. The combined approach produced ideas as original as
          those from PhD students, and stronger than the language model alone.
      - h3: "Designing surveys, questionnaires and interview guides"
      - markdown: |
          A recent study ([Yuan et al., 2026](https://doi.org/10.1371/journal.pone.0345117))
          explored how AI can support the design of psychological measurement tools, not
          just their analysis. The researchers fine-tuned a large language model on 169
          professional psychological questionnaires so it could generate new scales from a
          research topic or construct. Against off-the-shelf models it produced items that
          were more logically consistent (a 28.6% improvement) and adapted more reliably
          across cultural and regional contexts (over 85% accuracy) — moving from research
          idea to validated-style instrument faster, while keeping scientific rigour.
      - h3: "Suggesting appropriate research methods"
      - markdown: |
          Generative AI can support better experimental design by helping identify
          mediators (why something works), moderators (for whom it works) and alternative
          treatment arms ([Chang et al., 2024](https://doi.org/10.3386/w33025)). Language
          models can help brainstorm these elements, simulate synthetic participants to
          test ideas, and assess whether a study is likely to scale — though researchers
          still have to judge which AI-generated ideas are worth keeping.
      - h3: "Generating tailored intervention content"
      - markdown: |
          GPT-3.5 has been used to draft 1,150 SMS messages for medication adherence in
          type 2 diabetes, meeting behaviour-change, readability and tone standards
          ([Harrison et al., 2024](https://doi.org/10.2196/52974)). "MindShift" generates
          personalised persuasive messages that cut problematic smartphone use over five
          weeks ([Wu et al., 2024](https://doi.org/10.1145/3613904.3642790)), and
          [Mass General Brigham](https://www.massgeneralbrigham.org/en/about/newsroom/press-releases/pitfalls-and-opportunities-for-generative-ai-in-patient-messaging-systems)
          found a significant share of AI-drafted replies to patient messages were safe to
          send unedited ([Chen et al., 2024](https://doi.org/10.1016/S2589-7500(24)00060-8)).
      - h3: "Analysing past intervention data to refine strategies"
      - markdown: |
          Agentic AI is being applied to personalised health coaching, with one agent
          identifying barriers to healthy behaviour through motivational interviewing and
          another supplying tailored strategies using models like COM-B
          ([Yang et al., 2024](https://doi.org/10.48550/arXiv.2410.14041)). It reduces
          reliance on human coaches, but data privacy and unintended harms remain open
          problems — see LSE's
          [blog on agentic AI in behavioural science](https://blogs.lse.ac.uk/businessreview/2025/03/04/how-agentic-ai-can-be-applied-to-behavioural-science/).


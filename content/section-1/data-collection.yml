# section-1/data-collection.html — Stage 3.

title: "Data Collection &amp; Processing | BR-UK AI"
description: "AI tools for data collection and processing: chatbots (Qualtrics, Rasa), transcription (Vink, Otter), Julius AI, synthetic data generation."

breadcrumb:
  - { ref: "home",      label: "Home" }
  - { ref: "section-1", label: "Section 1: Living Guide" }
  - { label: "Data Collection &amp; Processing" }

badge: "Section 1 · Stage 3"
heading: "Data Collection &amp; Processing"

body:
  - prose:
      - lede: |
          AI tools can streamline many stages of data collection and processing,
          improving speed, efficiency, and in some cases, participant engagement. For
          example, AI-powered chatbots can support data collection by guiding respondents
          through surveys in an engaging, conversational format.
      - markdown: |
          That said, AI should be seen as a tool to support — not replace — human
          researchers, especially when it comes to ensuring data quality and ethical
          oversight.
      - quicknav:
          items:
            - { href: "#help",            label: "What AI can help with" }
            - { href: "#tools",           label: "Tools" }
            - { href: "#chatbots-qual",   label: "Chatbots compared with web surveys" }
            - { href: "#interventions",   label: "Delivering interventions" }
            - { href: "#synthetic",       label: "Synthetic data and populations" }
      - h2: { id: "help", text: "What AI can help with" }
      - markdown: |
          - Collecting and processing both qualitative and quantitative data (e.g. using chatbots or AI transcription tools).
          - Creating synthetic data or populations to study in isolation or supplement human datasets.
              - Synthetic data is artificially generated to mimic the statistical properties of real data, without containing any identifiable information — helping to protect individuals' privacy.
          - Delivering real-time behavioural interventions or guiding participants through them (e.g. via virtual coaches).
          - Automating reminders and adapting interventions based on user responses.
      - h2: { id: "tools", text: "Tools" }
      # Vink and Otter share one card because they do the same job; the card name
      # is therefore unlinked and both tools are linked inside the description.
      - tool_grid:
          - { url: "https://www.qualtrics.com/support/survey-platform/survey-module/editing-questions/conversational-feedback/", name: "Qualtrics", tag: "Paid", desc: "Turns static open-text questions into a dialogue. Its Conversational Feedback feature generates follow-ups tailored to each respondent's answer, and prompts for more detail when a response is too vague to act on — richer qualitative data without a longer survey upfront." }
          - { url: "https://rasa.com/", name: "Rasa", tag: "Free &amp; paid", desc: "An open-source framework for building custom conversational agents, tailorable for simulating interviews or collecting narrative data. Its CALM engine uses LLMs for understanding while you define the conversation logic — more control and auditability than a fully generative chatbot, but more setup than a plug-and-play tool." }
          - { name: "Vink / Otter AI", tag: "Free &amp; paid", desc: "Transcribe interview audio to text. [Vink](https://doi.org/10.1186/s13104-024-06842-4) is free and open-source, adapting OpenAI's Whisper to run locally on multilingual data — useful for sensitive recordings. [Otter AI](https://otter.ai/) is the commercial alternative, with HIPAA compliance on Enterprise plans under a signed Business Associate Agreement. Either way, use enhanced informed consent, secure data management and human verification of the output." }
          - { url: "https://julius.ai/glossary/data-transformation", name: "Julius AI Data Transformation", tag: "Free &amp; paid", desc: "Cleans, transforms and explores datasets through natural-language queries rather than code. Produces a preliminary assessment report flagging errors and outliers before transformation. Best suited to single-file, exploratory work; verify outputs manually for research use." }
          - { url: "https://docs.sdk.ydata.ai/latest/getting_started/synthetic_data/", name: "YData SDK", tag: "Free &amp; paid", desc: "Generates synthetic tabular, time-series and text data under specified privacy constraints such as k-anonymity and differential privacy — useful for datasets that mimic real behavioural or survey data without exposing it. Note the older `ydata-synthetic` package is deprecated; `ydata-sdk` is the maintained one." }
          - { url: "https://github.com/synthetichealth/synthea/wiki", name: "Synthea", tag: "Free", desc: "Generates complete, realistic but entirely fictional patient histories and health records. Free of the cost, privacy and security restrictions of real patient data, which suits public health research and intervention testing." }
          - { url: "https://listenlabs.ai/", name: "Listen Labs", tag: "Paid", desc: "Runs the full qualitative workflow — study design, recruitment, AI-moderated interviews with adaptive follow-ups, transcript analysis and reporting. Suited to rapid, large-scale or multilingual studies. It is a commercial research platform rather than an academic CAQDAS package: retain transcripts and prompts, validate AI-generated themes against the source material, and secure ethics and data-governance approval." }
      # Retitled: the Xiao et al. example was removed at the editor's request, so
      # this section now carries only the comparative finding.
      - h2: { id: "chatbots-qual", text: "Example: Chatbots compared with web surveys" }
      - markdown: |
          Researchers compared the effectiveness of chatbots and traditional web surveys in longitudinal data collection on daily news consumption. The findings indicated that web surveys generally yielded higher data quality and more favourable user evaluation. While chatbots offer the potential for increased interactivity and engagement, the study cautioned that they do not necessarily enhance data quality ([Zarouali et al., 2024](https://doi.org/10.1080/19312458.2022.2156489)).
      - h2: { id: "interventions", text: "Example: Delivering interventions" }
      - markdown: |
          Researchers reviewed 43 studies on text-based AI chatbots for health behaviour change, covering areas like physical activity, diet and smoking cessation ([Fu et al., 2026](https://doi.org/10.2196/79677)). Chatbots acted either as routine coaches or on-demand assistants, most built on frameworks like CBT. Most studies reported positive effects, though only about a third showed clearly observable improvements — the strongest evidence being in physical activity, smoking cessation, stress management and diet. The authors call for more rigorous, long-term trials, and for more evidence on cost and on underexplored behaviours such as sleep and weight management.
      - h2: { id: "synthetic", text: "Example: Synthetic data and populations" }
      - markdown: |
          Researchers developed an agentic AI architecture to simulate the attitudes and behaviours of over a thousand real individuals. By applying large language models to qualitative interviews, the generative agents replicated participants' responses on the General Social Survey with 85% accuracy. This approach demonstrates the potential of AI-driven agents to emulate human behaviour in social science research, offering a scalable method for studying individual and collective behaviours ([Park et al., 2024](https://doi.org/10.48550/arXiv.2411.10109)).
      - markdown: |
          However, while agentic AI provides opportunities, it also has risks. Researchers of a recent paper on potential harms arising from increasingly agentic AI systems argue that as machine learning systems gain more autonomy, they can introduce new forms of harm, particularly affecting marginalised communities. They emphasise the importance of proactively anticipating these harms rather than merely responding to them after deployment. The paper concludes that recognising the agency of algorithmic systems does not absolve human responsibility but highlights the need for robust governance to mitigate systemic and long-term impacts ([Chan et al., 2023](https://doi.org/10.1145/3593013.3594033)).


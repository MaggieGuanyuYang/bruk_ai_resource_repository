# section-2/key-regulations.html — Topic 5.

title: "Key Regulations | BR-UK AI"
description: "International AI frameworks, UK copyright and data protection law, and guidance from your own university or institution."

breadcrumb:
  - { ref: "home",      label: "Home" }

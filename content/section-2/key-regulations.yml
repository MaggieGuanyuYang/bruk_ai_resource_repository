badge: "Section 2 · Topic 5"
heading: "Key Regulations"

body:
  - prose:
      - lede: |
          Use these links to find the laws and guidance relevant to AI in your research,
          from international frameworks to UK requirements and your own institution’s
          policies. Check the original sources for their scope and latest updates.
      - raw: '<section class="resource-panel" aria-labelledby="international-frameworks">'
      - h2: { id: "international-frameworks", text: "International frameworks and guidance" }
      - markdown: |
          - [UNESCO Recommendation on the Ethics of Artificial Intelligence](https://www.unesco.org/en/artificial-intelligence/recommendation-ethics) — non-binding guidance on human rights, fairness, transparency, sustainability and human oversight.
          - [EU AI Act](https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai) — rules for AI systems based on their level of risk. Check whether your project falls within its scope, including any research exemptions.
          - [Living guidelines on the responsible use of generative AI in research](https://research-and-innovation.ec.europa.eu/document/download/2b6cf7e5-36ac-41cb-aab5-0d32050143dc_en) — European Commission guidance on research integrity, accountability and transparent AI use (May 2026 edition).
      - raw: '</section>'
      - raw: '<section class="resource-panel" aria-labelledby="uk-law">'
      - h2: { id: "uk-law", text: "UK law and guidance" }
      - markdown: |
          - [Copyright, Designs and Patents Act 1988](https://www.legislation.gov.uk/ukpga/1988/48/contents) — protects copyright in original works. Check permissions and licences for material used with AI and review outputs for third-party rights.
          - [UK GDPR and data protection: ICO guidance on AI](https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/artificial-intelligence/guidance-on-ai-and-data-protection/) — covers lawful, fair and secure use of personal data in AI, including individual rights and international transfers. Check the ICO’s updates as guidance is revised following the Data (Use and Access) Act 2025.
          - [ICO AI and data protection risk toolkit](https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/artificial-intelligence/guidance-on-ai-and-data-protection/ai-and-data-protection-risk-toolkit/) — practical support for identifying and reducing risks to people’s rights when using AI with personal data.
      - raw: '</section>'
      - raw: '<section class="resource-panel" aria-labelledby="local-guidance">'
      - h2: { id: "local-guidance", text: "Your university or institution" }
      - markdown: |
          Consult your own university’s current AI, research ethics, data protection and intellectual property policies. Requirements may vary by institution, project and tool.

          Contact your Local Research Ethics Committee Chair, Data Protection team or research support office to confirm which tools and uses are approved and what reviews your project needs. Seek advice before sharing research data with an AI service.
      - raw: '</section>'


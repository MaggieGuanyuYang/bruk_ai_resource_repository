badge: "Section 2 · Topic 4"
heading: "Sustainability Concerns"

body:
  - prose:
      - lede: |
          AI has the potential to support sustainable development goals, but it also comes
          with significant sustainability concerns. As AI tools become more embedded in
          the research process, we must ask: how do we harness AI for sustainability
          without deepening the harm it causes?
      - markdown: |
          AI systems, especially large language models, have substantial environmental impacts across their lifecycle, including electricity and water use, carbon emissions, hardware production and land use. One indication of this scale is that [Stanford’s 2026 AI Index](https://hai.stanford.edu/assets/files/ai_index_report_2026.pdf#page=38) estimates that the annual water use associated with running GPT-4o to respond to users’ requests may exceed the drinking-water needs of 1.2 million people.
      - h2: "Where AI's resource demand comes from"
      - h3: "Data centres"
      - markdown: |
          More and more data centres are needed to power AI and they use mostly fossil-fuel electricity and consume vast amounts of water for cooling. [Stanford's AI Index](https://hai.stanford.edu/assets/files/ai_index_report_2026.pdf#page=40) estimates the power needed to train and run AI systems worldwide is now roughly comparable to the total amount of electricity used by an entire country such as Switzerland or Austria.
      - h3: "Carbon emissions from training"
      - markdown: |
          As AI models have grown, improvements in energy efficiency have not kept pace with the increase in their size and computational demands. As a result, the power required to train frontier models has risen by several orders of magnitude since the early 2010s. The most compute-intensive models in the dataset, including Grok 3 and Llama 4 Behemoth, required more than 100 million watts during training. However, many newer models cannot be compared because their developers do not disclose power-use data.

          Training-related carbon emissions have increased even more sharply: from an estimated 0.01 tonnes of CO₂ equivalent for AlexNet in 2012 to approximately 72,816 tonnes for Grok 4 in 2025. For perspective, Grok 4’s estimated training emissions exceed the 63 tonnes of CO₂ emitted by an average car over its entire lifetime.

          *Source: [Stanford AI Index Report 2026, p. 33](https://hai.stanford.edu/assets/files/ai_index_report_2026.pdf#page=34).*
      - h3: "Global supply chain"
      - markdown: |
          Research also reveals that AI's environmental impact extends beyond data centres to encompass a complex global supply chain that extracts resources, manufactures components, and exploits labour across multiple industries and countries. Fieldwork in Querétaro, Mexico illustrates how AI data centres consume local water and energy supplies, creating scarcity for surrounding communities like Maconi. [This situation highlights the often hidden environmental justice concerns that arise when technological advancement conflicts with basic resource needs of local populations.](https://www.oii.ox.ac.uk/news-events/the-supply-chain-of-ai-the-environmental-impact-of-ai-and-the-need-to-reconsider-algorithmic-harms/)
      - h2: "Can AI still be part of the solution?"
      - markdown: |
          AI’s environmental costs are substantial, but efficiency is improving and there are credible pathways through which AI could support emissions reductions. These benefits are not automatic: they depend on how efficiently AI is designed and used, whether it is deployed in genuinely climate-relevant applications, and whether resulting efficiency gains outweigh additional demand.

          **Efficiency is improving, although total demand is still rising.** Newer hardware, smaller and specialised models, quantisation and software optimisation can substantially reduce the energy required for a given AI task. However, efficiency gains have so far been outweighed by the rapid growth in training and use, meaning that overall AI electricity demand continues to increase.

          **AI could reduce emissions in other sectors.** [The IEA estimates](https://www.iea.org/reports/energy-and-ai/ai-and-climate-change) that widespread adoption of existing AI applications could reduce global emissions through applications such as improving power-grid operation, detecting methane leaks, optimising industrial processes, reducing building energy use, and improving transport efficiency. These reductions are potential, not guaranteed, and depend on widespread adoption and effective implementation.
      - callout:
          heading: "For behavioural researchers"
          body: |
            AI isn't just a digital tool — it's a physical, global system. If we want to use it responsibly, we need to treat sustainability as a core part of how AI is designed, deployed, and governed.
      - markdown: |
          Check out the Alan Turing Institute’s public lecture on [What does it mean in real terms to make AI sustainable?](https://www.turing.ac.uk/events/turing-lectures-making-ai-truly-sustainable-environmental-costs-social-impacts)


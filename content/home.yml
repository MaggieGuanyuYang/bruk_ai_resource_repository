# Heading directly above the section grid. The former "Six sections cover the full
# picture…" intro line was removed in the 2026-08 revision; the template renders an
# `intro:` value only when one is present.
explore:
  heading: "How to explore the repository"

# The six big section cards on the home page, in order.
section_cards:
  - ref: "section-1"
    num: "Section 1"
    title: "Living Guide of AI in the Behavioural Research Process"
    desc: |
      Resources on how to use AI in literature review, hypothesis generation, data
      collection, analysis, and writing. Includes real-world examples and tool
      recommendations.
    meta: "5 sub-pages"
  - ref: "section-2"
    num: "Section 2"
    title: "Ethics, Sustainability &amp; Responsible AI Use"
    desc: |
      Disclosure and transparency, biases, privacy, sustainability, and the regulatory
      landscape. Includes funder and publisher guidance, and an overview of UK
      regulations.
    meta: "5 sub-pages + funder &amp; publisher guides"
  - ref: "section-3"
    num: "Section 3"
    title: "General AI Learning Resources"
    desc: |
      A curated set of courses, webinars, and YouTube channels — from Elements of AI
      and Harvard CS50 to researcher-specific tutorials and advanced deep-learning
      courses.
    meta: "Courses, videos, podcasts"
  # Summarises the three webinars rather than listing their titles: the card is a
  # teaser, and Section 4 itself carries the full titles and the links.
  - ref: "section-4"
    num: "Section 4"
    title: "BR-UK AI Webinars and Advice Sessions"
    desc: |
      Three on-demand webinars on improving behavioural research with AI, applying
      analytic AI, and using AI responsibly. Plus recordings of three advice sessions
      with Janna Hastings, Susan Michie, Amy Rodger, Maggie Guanyu Yang and Robert West.
    meta: "Webinars &amp; recordings"
  - ref: "statement"
    num: "Section 5"
    title: "Using AI for Behavioural Research Effectively and Responsibly"
    desc: |
      A forthcoming living statement addressing ethical standards, practical benefits
      and limitations, and recommendations for everyone doing, using, funding, or
      commissioning behavioural research.
    meta: "Living document"
  - ref: "section-5"
    num: "Section 6"
    title: "Disclaimer &amp; Contact"
    desc: |
      The repository is a living effort — resources evolve quickly. Here's how to get
      in touch with the BR-UK team and suggest additions, corrections, or feedback.
    meta: "Contact form &amp; emails"

# The "The Repository in a Nutshell" block at the bottom.
what:
  heading: "The Repository in a Nutshell"
  paragraphs:
    - |
      Generative AI (AI) is increasingly applied in behavioural research, with claims it
      can improve efficiency and quality for tasks like literature review, research
      design, data analysis, communication, and intervention planning. However, current
      evidence offers a mixed outlook, and more thorough evaluation is essential —
      especially considering research integrity risks. AI models may be biased due to
      skewed training data, which can reinforce stereotypes and underrepresent global
      viewpoints. AI raises ethical questions related to plagiarism, transparency, and
      privacy. Rapid, uncritical adoption could also lead to wider problems, such as
      degrading researcher skills, lowering public trust, and increasing environmental
      impact.
    - |
      This repository gives behavioural researchers an overview of the Generative AI
      landscape and points to key resources for further learning. It is not intended as
      a comprehensive guide.

# Standalone suggestion-form block, rendered below the Nutshell section.
suggest:
  - callout:
      heading: "Any suggestions?"
      body: |
        At BR-UK, we're committed to creating a resource for and informed by the
        behavioural research community. AI is evolving rapidly, and great learning
        opportunities arise from researchers exploring how to use AI tools in their
        research. If you have ideas, examples, or tools you'd like us to add to this
        resource, please fill in our [suggestion form](https://edinburgh.eu.qualtrics.com/jfe/form/SV_3Q51tiL8OymwC58).
        We welcome your contributions.

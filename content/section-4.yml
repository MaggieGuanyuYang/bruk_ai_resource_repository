# section-4.html — BR-UK AI Webinars and Advice Sessions.

title: "Section 4: BR-UK AI Webinars and Advice Sessions | BR-UK"
description: "Start with BR-UK's three AI webinars, then explore advice-session recordings addressing behavioural researchers' specific questions and requests for expert guidance."

breadcrumb:
  - { ref: "home", label: "Home" }
  - { label: "Section 4: BR-UK AI Webinars and Advice Sessions" }

badge: "Section 4"
heading: "BR-UK AI Webinars and Advice Sessions"

body:
  - prose:
      - lede:
          font_size: "1.12rem"
          text: |
            Start by watching BR-UK’s three AI webinars on using AI in behavioural
            research. Then explore the advice-session recordings for specific questions
            and expert guidance.
      - markdown: |
          All recordings are hosted on the University of Edinburgh's media platform and do not contain adverts.
      - h2: { id: "bruk-webinars", text: "BR-UK AI Webinars" }
      - subpage_list:
          style: "grid-template-columns: 1fr"
          items:
            - href: "https://media.ed.ac.uk/media/BR-UK+%3A+Using+AI+to+Improve+Behavioural+Research/1_qv7xyowy/370463662"
              title: "Using Artificial Intelligence to improve Behavioural Research"
              blurb: "Watch the webinar recording"
            - href: "https://media.ed.ac.uk/media/Behavioural+Research+UK%3A+Using+Analytic+AI+to+improve+Behavioural+Research/1_jntcg6ha"
              title: "Using Analytic AI to improve Behavioural Research"
              blurb: "Watch the webinar recording"
            - href: "https://media.ed.ac.uk/media/Responsible+use+of+AI+in+behavioural+research/1_1t0mu0vb"
              title: "Responsible use of AI in behavioural research"
              blurb: "Watch the webinar recording"
      - h2: { id: "advice-sessions", text: "AI advice sessions" }
      - markdown: |
          After watching the webinars, explore recordings of BR-UK’s three advice sessions. These sessions were designed for researchers who wanted to ask specific questions or seek expert advice about using AI in behavioural research.
      - subpage_list:
          style: "grid-template-columns: 1fr"
          items:
            - { href: "https://media.ed.ac.uk/media/BR-UK+AI+Help+Desk+Session+1/1_fplyn9zp",                  title: "September 2025 — BR-UK AI Advice Session 1", blurb: "Watch the first of three sessions" }
            - { href: "https://media.ed.ac.uk/media/AI+Advice+Session+November+2025/1_qkmffer5/370463662",     title: "November 2025 — BR-UK AI Advice Session 2",  blurb: "Watch the second of three sessions" }
            - { href: "https://media.ed.ac.uk/media/AI+Advice+Session+January+2026/1_1bisfoyb/370463662",      title: "January 2026 — BR-UK AI Advice Session 3",   blurb: "Watch the third of three sessions" }

